name: Deploy API

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt .env.prod
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          mkdir -p .ansible
          echo "$ANSIBLE_VAULT_PASSWORD" > .ansible/vault-pass
          chmod 600 .ansible/vault-pass
          ansible-vault decrypt --output=.env.decrypted docker/prod/.env.prod
          rm -f .ansible/vault-pass

      - name: Pack application code
        run: |
          tar --exclude='./.git' \
              --exclude='./node_modules' \
              --exclude='./vendor' \
              --exclude='./tests' \
              --exclude='./.github' \
              --exclude='./storage/logs/*' \
              --exclude='./storage/framework/cache/*' \
              --exclude='./storage/framework/sessions/*' \
              --exclude='./storage/framework/views/*' \
              --exclude='./docker/dev' \
              --exclude='./.ansible' \
              -czf /tmp/helmreel-app.tar.gz .

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare remote dirs
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'sudo mkdir -p /opt/helmreel/{docker/prod,app} && sudo chown -R ${{ secrets.VM_USER }}:${{ secrets.VM_USER }} /opt/helmreel'

      - name: Upload compose, nginx and env
        run: |
          scp -i ~/.ssh/id_rsa docker/prod/docker-compose.yml  ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/helmreel/docker/prod/docker-compose.yml
          scp -i ~/.ssh/id_rsa docker/prod/nginx.conf          ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/helmreel/docker/prod/nginx.conf
          scp -i ~/.ssh/id_rsa docker/prod/nginx.no-tls.conf   ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/helmreel/docker/prod/nginx.no-tls.conf
          scp -i ~/.ssh/id_rsa docker/prod/opcache.ini         ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/helmreel/docker/prod/opcache.ini
          scp -i ~/.ssh/id_rsa .env.decrypted                  ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/helmreel/docker/prod/.env

      - name: Upload application tarball
        run: |
          scp -i ~/.ssh/id_rsa /tmp/helmreel-app.tar.gz ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/helmreel-app.tar.gz

      - name: Authenticate VM Docker with Artifact Registry
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          # The VM's local gcloud credential store is corrupt
          # (gcloud "duplicate column name: regional_access_boundary"), which
          # breaks Docker's credential helper for *.pkg.dev. Instead of relying
          # on the VM's gcloud, mint a short-lived access token here on the
          # runner (which has a healthy gcloud) from the service-account key and
          # log the VM's Docker into Artifact Registry directly. This is Google's
          # recommended approach for CI and sidesteps the broken store entirely.
          echo "$GCP_SA_KEY" > /tmp/gcp-sa-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-sa-key.json
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          rm -f /tmp/gcp-sa-key.json

          ssh -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "docker login -u oauth2accesstoken --password-stdin https://europe-west1-docker.pkg.dev" <<< "$ACCESS_TOKEN"

      - name: Apply on VM
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/helmreel

          rm -rf app.new
          mkdir -p app.new
          tar -xzf /tmp/helmreel-app.tar.gz -C app.new
          rm /tmp/helmreel-app.tar.gz

          rm -rf app.old
          if [ -d app ]; then mv app app.old; fi
          mv app.new app

          docker compose -f docker/prod/docker-compose.yml pull
          docker compose -f docker/prod/docker-compose.yml up -d --remove-orphans --force-recreate

          docker compose -f docker/prod/docker-compose.yml exec -T php composer install --no-dev --no-interaction --optimize-autoloader --working-dir=/code

          # Ensure the writable storage structure exists (the volume can start
          # empty; without framework/views Laravel can't compile Blade and any
          # error page itself 500s). Idempotent.
          docker compose -f docker/prod/docker-compose.yml exec -T php sh -c \
            'mkdir -p /code/storage/framework/views /code/storage/framework/cache/data /code/storage/framework/sessions /code/storage/logs && chmod -R 775 /code/storage && chown -R www-data:www-data /code/storage'

          # Retry migrate until MySQL is ready (a slow DB start previously left the
          # database empty because this step ran before MySQL accepted connections).
          migrated=false
          for i in $(seq 1 30); do
            if docker compose -f docker/prod/docker-compose.yml exec -T php php /code/artisan migrate --force; then
              migrated=true
              break
            fi
            echo "migrate failed (MySQL not ready?), retry $i/30"
            sleep 5
          done
          # If it still failed after 30 tries, run once more unguarded so a real
          # migration error propagates and aborts the deploy (set -e).
          if [ "$migrated" != "true" ]; then
            docker compose -f docker/prod/docker-compose.yml exec -T php php /code/artisan migrate --force
          fi

          docker compose -f docker/prod/docker-compose.yml exec -T php php /code/artisan config:cache
          docker compose -f docker/prod/docker-compose.yml exec -T php php /code/artisan route:cache

          rm -rf app.old
          REMOTE

      - name: Cleanup local decrypted env
        if: always()
        run: rm -f .env.decrypted /tmp/helmreel-app.tar.gz
