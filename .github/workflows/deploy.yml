name: Deploy API

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt .env.prod
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          mkdir -p .ansible
          echo "$ANSIBLE_VAULT_PASSWORD" > .ansible/vault-pass
          chmod 600 .ansible/vault-pass
          ansible-vault decrypt --output=.env.decrypted docker/prod/.env.prod
          rm -f .ansible/vault-pass

      - name: Pack application code
        run: |
          tar --exclude='./.git' \
              --exclude='./node_modules' \
              --exclude='./vendor' \
              --exclude='./tests' \
              --exclude='./.github' \
              --exclude='./storage/logs/*' \
              --exclude='./storage/framework/cache/*' \
              --exclude='./storage/framework/sessions/*' \
              --exclude='./storage/framework/views/*' \
              --exclude='./docker/dev' \
              --exclude='./.ansible' \
              -czf /tmp/helmreel-app.tar.gz .

      - name: Install SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare remote dirs
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'sudo mkdir -p /opt/helmreel/{docker/prod,app} && sudo chown -R ${{ secrets.VM_USER }}:${{ secrets.VM_USER }} /opt/helmreel'

      - name: Upload compose, nginx and env
        run: |
          scp -i ~/.ssh/id_rsa docker/prod/docker-compose.yml  ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/helmreel/docker/prod/docker-compose.yml
          scp -i ~/.ssh/id_rsa docker/prod/nginx.conf          ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/helmreel/docker/prod/nginx.conf
          scp -i ~/.ssh/id_rsa docker/prod/nginx.no-tls.conf   ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/helmreel/docker/prod/nginx.no-tls.conf
          scp -i ~/.ssh/id_rsa docker/prod/opcache.ini         ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/helmreel/docker/prod/opcache.ini
          scp -i ~/.ssh/id_rsa .env.decrypted                  ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/helmreel/docker/prod/.env

      - name: Upload application tarball
        run: |
          scp -i ~/.ssh/id_rsa /tmp/helmreel-app.tar.gz ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/helmreel-app.tar.gz

      - name: Apply on VM
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/helmreel

          rm -rf app.new
          mkdir -p app.new
          tar -xzf /tmp/helmreel-app.tar.gz -C app.new
          rm /tmp/helmreel-app.tar.gz

          rm -rf app.old
          if [ -d app ]; then mv app app.old; fi
          mv app.new app

          docker compose -f docker/prod/docker-compose.yml pull
          docker compose -f docker/prod/docker-compose.yml up -d --remove-orphans --force-recreate

          docker compose -f docker/prod/docker-compose.yml exec -T php composer install --no-dev --no-interaction --optimize-autoloader --working-dir=/code
          docker compose -f docker/prod/docker-compose.yml exec -T php php /code/artisan migrate --force
          docker compose -f docker/prod/docker-compose.yml exec -T php php /code/artisan config:cache
          docker compose -f docker/prod/docker-compose.yml exec -T php php /code/artisan route:cache

          rm -rf app.old
          REMOTE

      - name: Cleanup local decrypted env
        if: always()
        run: rm -f .env.decrypted /tmp/helmreel-app.tar.gz
