get:
  tags: [YouTube - Video]
  operationId: getVideos
  summary: List videos across all owned channels (paginated)
  description: >-
    Returns videos belonging to channels owned by the authenticated user. Served
    from the local database (no YouTube API call). Supports filtering by
    `category`, `channel_id`, free-text search `q` over the title, and standard
    pagination params.
  security:
    - ApiToken: []
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 1-based page number.
      example: 1
    - name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 12
      description: Items per page (max 100).
      example: 12
    - name: category
      in: query
      required: false
      schema:
        type: string
        enum: [video, short]
      description: Filter by category. Omit to include both.
      example: video
    - name: channel_id
      in: query
      required: false
      schema:
        type: string
      description: Filter by a specific channel ID owned by the authenticated user.
      example: 'UCxxxxxxxxxxxxxxxxxxxxxx'
    - name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
      description: Free-text search over the video title (LIKE %q%).
      example: 'react'
  responses:
    '200':
      $ref: '../Response/GetChannelVideos.yaml'
    '401':
      $ref: '../../../Shared/Response/401.yaml'
    '422':
      $ref: '../../../Shared/Response/422.yaml'
    '500':
      $ref: '../../../Shared/Response/500.yaml'
