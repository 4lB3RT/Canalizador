server {
    listen 80;
    listen [::]:80;
    server_name canalizador.app www.canalizador.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name canalizador.app www.canalizador.app;

    ssl_certificate     /etc/letsencrypt/live/canalizador.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canalizador.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 200M;
    error_log  /var/log/nginx/canalizador.error.log;
    access_log /var/log/nginx/canalizador.access.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /var/www/canalizador;
    index index.html;

    location /api {
        rewrite ^/api/?(.*)$ /$1 break;
        try_files $uri $uri/ /index.php?$query_string;
        root /code/public;
    }

    location ~ ^/(login|register|forgot-password|reset-password|auth)(/.*)?$ {
        try_files $uri $uri/ /index.php?$query_string;
        root /code/public;
    }

    location ~ \.php$ {
        try_files $uri =404;
        root /code/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param APPLICATION_ENV production;
        fastcgi_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
