server {
    listen 80;
    server_name helmreel.local;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /code/public;
    index index.php index.html;
    client_max_body_size 25M;

    # API: strip /api and hand to PHP (mirrors prod).
    location /api {
        rewrite ^/api/?(.*)$ /$1 break;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # OAuth callbacks go to the backend (mirrors prod).
    location ~ ^/auth(/.*)?$ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_helmreel:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param APPLICATION_ENV development;
        fastcgi_read_timeout 300s;
    }

    # SPA: proxy everything else to the Vite dev server running on the host
    # (helmreel-web, `npm run dev`). Upgrade headers keep HMR's WebSocket
    # alive so edits hot-reload in the browser.
    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
