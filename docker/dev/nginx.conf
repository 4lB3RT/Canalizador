server {
    listen 80;
    server_name helmreel.local;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Web root for the static SPA build + landing/legal pages (mirrors prod:
    # nginx serves the compiled SPA, no Vite). Generated by docker/commands/build-spa.sh
    # into helmreel-web/dev-web and mounted here.
    root /var/www/helmreel;
    index index.html;
    client_max_body_size 25M;

    # API: strip /api and hand to PHP (mirrors prod).
    location /api {
        rewrite ^/api/?(.*)$ /$1 break;
        try_files $uri $uri/ /index.php?$query_string;
        root /code/public;
    }

    # OAuth callbacks go to the backend (mirrors prod).
    location ~ ^/auth(/.*)?$ {
        try_files $uri $uri/ /index.php?$query_string;
        root /code/public;
    }

    location ~ \.php$ {
        try_files $uri =404;
        root /code/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_helmreel:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param APPLICATION_ENV development;
        fastcgi_read_timeout 300s;
    }

    # SPA assets (hashed filenames) — long cache.
    location /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The compiled SPA lives under /app; client-side routes fall back to its index.
    location /app {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /app/index.html;
    }

    # Static public site at the root: landing.html, privacy.html, terms.html, brand assets.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /landing.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
